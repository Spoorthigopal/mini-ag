<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a84ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#003366;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff9f0a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff453a;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Outer Swooshes -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="url(#grad1)" stroke-width="15" stroke-dasharray="700 300" transform="rotate(-45 200 200)" stroke-linecap="round"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="url(#grad2)" stroke-width="12" stroke-dasharray="500 400" transform="rotate(135 200 200)" stroke-linecap="round"/>
  <circle cx="200" cy="200" r="180" fill="none" stroke="url(#grad1)" stroke-width="8" stroke-dasharray="600 500" transform="rotate(45 200 200)" stroke-linecap="round"/>
  
  <!-- Graduation Cap -->
  <path d="M120 180 L200 140 L280 180 L200 220 Z" fill="#2d3748" />
  <path d="M140 190 L140 240 Q200 270 260 240 L260 190 Z" fill="#4a5568" />
  <circle cx="200" cy="180" r="5" fill="#a0aec0" />
  <path d="M280 180 L280 250" stroke="#ff9f0a" stroke-width="4" />
  <circle cx="280" cy="255" r="8" fill="#ff453a" />

  <!-- Text -->
  <text x="200" y="340" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="#ffffff" text-anchor="middle">GRADSphere</text>
  <text x="200" y="370" font-family="Arial, sans-serif" font-size="20" fill="#a0aec0" text-anchor="middle">Empowering College Journeys</text>
</svg>
